<!doctype html>
<html lang="zh-CN" data-theme="dark" data-language="zh"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="robots" content="noindex"/><title>Waypoint · 内容管理</title><link rel="icon" href="./favicon.svg"/><link rel="stylesheet" href="./styles.css"/><script>try{document.documentElement.dataset.theme=localStorage.getItem('waypoint-theme')==='light'?'light':'dark';document.documentElement.dataset.language=localStorage.getItem('waypoint-language')==='en'?'en':'zh';}catch{}</script><script type="module" src="./manage.js"></script></head><body>
  <header class="site-header"><div class="header-inner"><a class="brand" href="./">Waypoint.</a><a class="manage-home" href="./" data-i18n="back">回到起点</a><div class="header-controls"><button class="language-toggle" type="button">EN</button><button class="manage-theme" type="button" data-i18n="toLight">切换为浅色模式</button></div></div></header>
  <main class="section-shell manage-main"><p class="eyebrow" data-i18n="manage">内容管理</p><h1 data-i18n="manageTitle">整理下一段经历。</h1><p class="manage-intro" data-i18n="manageIntro">比赛和文章可以先存为草稿，整理好再发布。</p>
    <p id="manage-status" role="status" aria-live="polite"></p>
    <form class="owner-signin" hidden><p data-i18n="ownerOnly">使用管理密码登录后整理内容。</p><label><span data-i18n="password">管理密码</span><input name="password" type="password" autocomplete="current-password" required maxlength="256"/></label><button class="button button-primary" type="submit" data-i18n="signIn">登录</button></form>
    <button class="button button-quiet manage-logout" type="button" hidden data-i18n="signOut">退出登录</button>
    <section class="manage-account" hidden>
      <details class="password-settings"><summary data-i18n="changePassword">修改密码</summary>
        <form class="password-editor">
          <label><span data-i18n="currentPassword">当前密码</span><input name="currentPassword" type="password" autocomplete="current-password" required maxlength="256"/></label>
          <label><span data-i18n="newPassword">新密码</span><input name="newPassword" type="password" autocomplete="new-password" required minlength="10" maxlength="128"/></label>
          <label><span data-i18n="confirmPassword">确认新密码</span><input name="confirmPassword" type="password" autocomplete="new-password" required minlength="10" maxlength="128"/></label>
          <p class="editor-help" data-i18n="passwordHelp">新密码至少 10 个字符。修改后，其他设备需要重新登录。</p>
          <p id="password-status" role="status" aria-live="polite"></p>
          <button class="button button-primary" type="submit" data-i18n="savePassword">保存新密码</button>
        </form>
      </details>
    </section>
    <div class="manage-workspace" hidden><aside class="manage-sidebar"><div class="manage-new"><button class="button button-primary" id="new-race" type="button" data-i18n="newRace">新增比赛</button><button class="button button-quiet" id="new-article" type="button" data-i18n="newArticle">新增文章</button></div><h2 data-i18n="entries">我的内容</h2><div class="managed-entries"></div></aside>
      <form class="entry-editor" hidden><input name="id" type="hidden"/><input name="kind" type="hidden"/>
        <div class="editor-grid"><label><span data-i18n="titleZh">中文标题</span><input name="titleZh" maxlength="160" required/></label><label><span data-i18n="titleEn">英文标题</span><input name="titleEn" maxlength="160"/></label><label><span data-i18n="date">日期</span><input name="date" type="date" required/></label><label class="race-field"><span data-i18n="raceCategory">比赛类型</span><select name="category"><option value="10K" data-i18n="raceTenK">10K</option><option value="Half Marathon" data-i18n="raceHalf">半马</option><option value="Marathon" data-i18n="raceFull">全马</option><option value="Trail" data-i18n="trail">越野赛</option><option value="Spartan" data-i18n="raceSpartan">斯巴达</option><option value="Hyrox" data-i18n="raceHyrox">HYROX</option><option value="Road" data-i18n="road">公路跑</option><option value="Other" data-i18n="other">其他</option></select></label></div>
        <label class="race-field"><span data-i18n="raceSubtype">组别 / 级别</span><input name="subtype" maxlength="80" placeholder="Sprint / Super / Beast / Ultra / Pro"/></label>
        <div class="race-field editor-grid editor-metrics"><label><span data-i18n="raceDistance">距离</span><input name="distance" type="number" min="0" max="10000" step="any" placeholder="km"/></label><label><span data-i18n="raceAscent">爬升</span><input name="ascent" type="number" min="0" max="100000" placeholder="m"/></label><label><span data-i18n="raceResult">完赛时间</span><input name="result" placeholder="08:32:10" pattern="[0-9]{1,3}:[0-5][0-9](:[0-5][0-9])?"/></label></div>
        <label class="article-field"><span data-i18n="wechatUrl">公众号文章链接</span><input name="wechatUrl" type="url" placeholder="https://mp.weixin.qq.com/…"/></label>
        <label><span data-i18n="bodyZh">中文正文</span><textarea name="bodyZh" rows="7" maxlength="60000"></textarea></label><label><span data-i18n="bodyEn">英文正文</span><textarea name="bodyEn" rows="7" maxlength="60000"></textarea></label><p class="editor-help" data-i18n="bodyHelp">每段之间留一行空行。</p>
        <fieldset class="media-field"><legend data-i18n="photos">照片</legend><input id="photo-upload" type="file" accept="image/jpeg,image/png,image/webp" multiple aria-label="照片" data-i18n-aria="photos"/><div class="managed-photos"></div></fieldset><fieldset class="media-field race-field"><legend data-i18n="certificates">证书</legend><input id="certificate-upload" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" multiple aria-label="证书" data-i18n-aria="certificates"/><div class="managed-certificates"></div></fieldset>
        <p class="editor-help" data-i18n="uploadHelp">照片支持 JPG、PNG、WebP；证书也支持 PDF。每个文件最多 8 MB。</p><p class="editor-help" data-i18n="englishHelp">发布需要中英文标题；文章正文也需双语，比赛介绍可以留空。</p>
        <div class="editor-actions"><button class="button button-quiet" type="submit" name="intent" value="draft" data-i18n="saveDraft">保存草稿</button><button class="button button-primary" type="submit" name="intent" value="publish" data-i18n="publish">发布到网站</button></div>
      </form>
    </div>
  </main>
</body></html>
